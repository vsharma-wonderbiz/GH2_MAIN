services:
  postgres:
    image: postgres:16
    container_name: gh2_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - gh2_network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: rabbitmq_container
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - gh2_network

  modsim:
    build: ./modsim
    container_name: modsim-server
    restart: on-failure:5
    ports:
      - "5020:5020"
      - "9000:9000"
    env_file:
      - ./modsim/.env
    volumes:
      - ./modsim:/app/Modsim
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5020 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gh2_network

  backend:
    build: ./Backend/GH2-Main
    container_name: GH2-Backend
    restart: on-failure:10
    ports:
      - "7144:7144"
    env_file:
      - ./Backend/GH2-Main/GH2-Main/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      modsim:
        condition: service_started
    volumes:
      - ./modsim:/shared/modsim
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7144/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - gh2_network

  opcua:
    build: ./opcua/server
    container_name: opcua-server
    restart: on-failure:10
    ports:
      - "4840:4840"
    env_file:
      - ./opcua/server/.env
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4840 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - gh2_network

  opcua_client:
    build: ./opcua/Client
    container_name: opcua-client
    restart: on-failure:10
    env_file:
      - ./opcua/client/.env
    depends_on:
      opcua:
        condition: service_healthy
    networks:
      - gh2_network

  frontend:
    build:
      context: ./Frontend
      dockerfile: dockerfile
    container_name: gh2-frontend
    restart: on-failure:5
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_BASE_URL: http://localhost:7144/api
    networks:
      - gh2_network

networks:
  gh2_network:
    driver: bridge

volumes:
  rabbitmq_data: